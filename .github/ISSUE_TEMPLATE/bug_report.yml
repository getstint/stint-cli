name: Bug report
description: Something in the Stint CLI or one of its integrations doesn't work the way it should.
title: "bug: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please don't paste your API key or anything from `~/.stint/config.json`. For security problems, use a private advisory instead (see SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Signing in
        - Claude Code
        - Codex CLI
        - Gemini CLI
        - OpenCode
        - stint run (other agents)
        - WakaTime plugins
        - Editors
        - sync (importing history)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Run npx getstint install codex
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx getstint doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Recent lines from ~/.stint/stint.log
      description: Remove anything private first.
      render: text
  - type: input
    id: os
    attributes:
      label: Operating system and shell
      placeholder: macOS 26, zsh
    validations:
      required: true
